<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet261 Virtual Expert Pro</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151f32;
            --accent: #22c55e;
            --gold: #facc15;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #22314d;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }
        .app-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .badge {
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        h1 { font-size: 24px; margin: 8px 0 0 0; font-weight: 800; color: #fff; }
        h1 span { color: var(--gold); }
        .subtitle { color: var(--text-sub); font-size: 12px; margin: 4px 0 0 0; }
        
        .form-group { display: flex; gap: 10px; margin-bottom: 12px; }
        .input-box { flex: 1; display: flex; flex-direction: column; }
        label { color: var(--text-sub); font-size: 11px; font-weight: bold; margin-bottom: 4px; text-transform: uppercase; }
        select, input {
            background: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            width: 100%;
        }
        select:focus, input:focus { border-color: var(--gold); }
        
        .btn-prime {
            width: 100%;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-sec {
            width: 100%;
            background: transparent;
            color: var(--text-sub);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 8px;
        }

        /* Résultats */
        .res-panel {
            background: #0b0f19;
            border-radius: 16px;
            padding: 16px;
            margin-top: 20px;
            border: 1px solid var(--border);
            display: none;
        }
        .res-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border);
        }
        .res-row:last-child { border-bottom: none; }
        .res-label { font-size: 13px; color: var(--text-sub); }
        .res-val { font-size: 14px; font-weight: bold; color: #fff; }
        .highlight { color: var(--gold); font-size: 16px; }
        .stars { color: var(--gold); font-size: 18px; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <span class="badge">Méthode Tendance & Indices de Confiance</span>
        <h1>BET261 <span>EXPERT V4</span></h1>
        <p class="subtitle">Analyse statistique de la ligue virtuelle anglaise</p>
    </div>

    <div class="form-group">
        <div class="input-box">
            <label>Équipe Domicile</label>
            <select id="homeTeam"></select>
        </div>
        <div class="input-box">
            <label>Équipe Extérieur</label>
            <select id="awayTeam"></select>
        </div>
    </div>

    <div class="form-group">
        <div class="input-box">
            <label>Matchs sans victoire (Dom)</label>
            <input type="number" id="defaites" value="0" min="0">
        </div>
        <div class="input-box">
            <label>Moy. Buts (3 derniers matchs)</label>
            <input type="number" step="0.1" id="buts" value="1.5">
        </div>
    </div>

    <div class="form-group">
        <div class="input-box">
            <label>Cote [1]</label>
            <input type="number" step="0.01" id="cote1" placeholder="Ex: 1.55">
        </div>
        <div class="input-box">
            <label>Cote [N]</label>
            <input type="number" step="0.01" id="coteN" placeholder="Ex: 3.90">
        </div>
        <div class="input-box">
            <label>Cote [2]</label>
            <input type="number" step="0.01" id="cote2" placeholder="Ex: 6.28">
        </div>
    </div>

    <button class="btn-prime" onclick="calculerAnalyse()">ANALYSER LE MATCH</button>
    <button class="btn-sec" onclick="reinitialiser()">Effacer les filtres</button>

    <div class="res-panel" id="resultats">
        <div class="res-row">
            <span class="res-label">Match :</span>
            <span class="res-val" id="match-title" style="color:var(--gold)">-</span>
        </div>
        <div class="res-row">
            <span class="res-label">⭐ Indice de confiance :</span>
            <span class="stars" id="val-stars">⭐⭐⭐</span>
        </div>
        <div class="res-row">
            <span class="res-label">📋 Option conseillée :</span>
            <span class="res-val" id="val-option" style="color:#22c55e">-</span>
        </div>
        <div class="res-row">
            <span class="res-label">⚽ Tendance Buts :</span>
            <span class="res-val highlight" id="val-total-buts">-</span>
        </div>
        <div class="res-row">
            <span class="res-label">🎯 Score Exact Proche :</span>
            <span class="res-val highlight" id="val-score" style="color:var(--gold)">-</span>
        </div>
    </div>
</div>

<script>
    // Liste des clubs
    const clubs = [
        "Bournemouth", "Manchester Blue", "C. Palace", "A. Villa", 
        "London Blues", "Everton", "Newcastle", "Fulham", 
        "Manchester Red", "N. Forest", "Brighton", "London Reds", 
        "Wolverhampton", "Spurs", "Liverpool", "Sunderland", 
        "Leeds", "Brentford", "Burnley", "West Ham"
    ].sort();

    const homeSelect = document.getElementById('homeTeam');
    const awaySelect = document.getElementById('awayTeam');
    clubs.forEach(club => {
        homeSelect.options[homeSelect.options.length] = new Option(club, club);
        awaySelect.options[awaySelect.options.length] = new Option(club, club);
    });
    awaySelect.selectedIndex = 1;

    function calculerAnalyse() {
        const home = document.getElementById('homeTeam').value;
        const away = document.getElementById('awayTeam').value;
        const defaites = parseInt(document.getElementById('defaites').value) || 0;
        const buts = parseFloat(document.getElementById('buts').value) || 0;
        
        const c1 = parseFloat(document.getElementById('cote1').value) || 0;
        const cN = parseFloat(document.getElementById('coteN').value) || 0;
        const c2 = parseFloat(document.getElementById('cote2').value) || 0;

        if (home === away) { alert("Choisissez deux équipes différentes !"); return; }
        if (!c1 || !cN || !c2) { alert("Veuillez remplir les 3 cotes !"); return; }

        document.getElementById('resultats').style.display = "block";
        document.getElementById('match-title').innerText = home + " vs " + away;

        // 1. Détermination du favori et de la force de l'indice
        let indiceScore = 2; // Base de départ : 2 étoiles
        if (defaites >= 4) indiceScore += 2; // Grosse série sans victoire = opportunité de rebond
        else if (defaites >= 2) indiceScore += 1;
        
        if (Math.min(c1, c2) < 1.60) indiceScore += 1; // Très gros favori selon Bet261

        // Limiter les étoiles entre 1 et 5
        indiceScore = Math.max(1, Math.min(5, indiceScore));
        document.getElementById('val-stars').innerText = "⭐".repeat(indiceScore);

        // 2. Option conseillée (Remplacement de Kelly par des conseils clairs)
        const txtOption = document.getElementById('val-option');
        if (indiceScore >= 4) {
            let choix = c1 < c2 ? home : away;
            txtOption.innerText = "Victoire " + choix + " (Mise Confiance 🔥)";
            txtOption.style.color = "#22c55e";
        } else if (indiceScore === 3) {
            let choix = c1 < c2 ? "Chance Double 1X" : "Chance Double X2";
            txtOption.innerText = choix + " (Mise Modérée ⚠️)";
            txtOption.style.color = "#facc15";
        } else {
            txtOption.innerText = "Match piège - S'abstenir / Jouer les Buts ❌";
            txtOption.style.color = "#ef4444";
        }

        // 3. Tendance Buts (Over / Under)
        const txtTotal = document.getElementById('val-total-buts');
        if (buts >= 2.4) {
            txtTotal.innerText = "Plus de 2.5 Buts dans le match";
        } else if (buts <= 1.4) {
            txtTotal.innerText = "Moins de 1.5 Buts dans le match";
        } else {
            txtTotal.innerText = "Plus de 1.5 Buts (Sécurisé)";
        }

        // 4. Score Exact Proche
        const txtScore = document.getElementById('val-score');
        if (c1 < c2) { // Domicile favori
            if (buts >= 2.4) txtScore.innerText = "2-1 ou 3-1";
            else if (buts <= 1.4) txtScore.innerText = "1-0 ou 2-0";
            else txtScore.innerText = "2-0 ou 2-1";
        } else if (c2 < c1) { // Extérieur favori
            if (buts >= 2.4) txtScore.innerText = "1-2 ou 1-3";
            else if (buts <= 1.4) txtScore.innerText = "0-1 ou 0-2";
            else txtScore.innerText = "0-2 ou 1-2";
        } else { // Match Nul serré
            txtScore.innerText = buts >= 2.4 ? "2-2 ou 1-1" : "0-0 ou 1-1";
        }
    }

    function reinitialiser() {
        document.getElementById('defaites').value = "0";
        document.getElementById('buts').value = "1.5";
        document.getElementById('cote1').value = "";
        document.getElementById('coteN').value = "";
        document.getElementById('cote2').value = "";
        document.getElementById('resultats').style.display = "none";
    }
</script>

</body>
</html>
