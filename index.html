<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet261 Virtual Expert</title>
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; }
        h1 { color: #facc15; text-align: center; margin-bottom: 2px; font-size: 24px; font-weight: bold; }
        .subtitle { color: #94a3b8; text-align: center; font-size: 13px; margin-top: 0; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        label { color: #cbd5e1; font-size: 14px; }
        input { background-color: #1e293b; border: 1px solid #475569; border-radius: 12px; padding: 14px; color: white; font-size: 16px; outline: none; }
        input:focus { border-color: #facc15; }
        button { background-color: #facc15; color: #0f172a; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-clear { background-color: transparent; border: 1px solid #94a3b8; color: #94a3b8; padding: 10px; }
        .result-box { background-color: #1e293b; border-radius: 16px; padding: 20px; text-align: center; margin-top: 10px; }
        #prediction { font-size: 15px; font-weight: 500; margin-bottom: 8px; line-height: 1.4; }
        #confiance { font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>BET261 VIRTUAL EXPERT</h1>
    <p class="subtitle">Analyse mathématique de la ligue</p>
    <div class="input-group"><label>Matchs consécutifs sans victoire</label><input type="number" id="defaites" placeholder="Ex: 5"></div>
    <div class="input-group"><label>Moyenne buts (3 derniers matchs)</label><input type="number" step="0.1" id="buts" placeholder="Ex: 2.5"></div>
    <div class="input-group"><label>Cote actuelle Bet261</label><input type="number" step="0.01" id="cote" placeholder="Ex: 1.75"></div>
    <button onclick="calculerKelly()">CALCULER L'ANALYSE KELLY</button>
    <button class="btn-clear" onclick="effacer()">EFFACER LES DONNÉES</button>
    <div class="result-box"><div id="prediction">En attente de saisie des données...</div><div id="confiance"></div></div>
</div>
<script>
    function calculerKelly() {
        const defaites = parseInt(document.getElementById('defaites').value) || 0;
        const buts = parseFloat(document.getElementById('buts').value) || 0;
        const cote = parseFloat(document.getElementById('cote').value.replace(',', '.')) || 0;
        const predText = document.getElementById('prediction');
        const confText = document.getElementById('confiance');
        if (cote <= 1) {
            predText.innerText = "Veuillez entrer une cote valide supérieure à 1.00";
            predText.style.color = "#ef4444"; confText.innerText = ""; return;
        }
        let probabiliteGagne = 0.38;
        if (defaites > 0) probabiliteGagne += (defaites * 0.11);
        if (buts > 2.2) probabiliteGagne += 0.06;
        if (probabiliteGagne > 0.92) probabiliteGagne = 0.92;
        const b = cote - 1; const p = probabiliteGagne; const q = 1 - p;
        const fractionKelly = ((b * p) - q) / b; const pourcentageMise = fractionKelly * 100;
        confText.innerText = "Probabilité estimée : " + Math.round(probabiliteGagne * 100) + "%";
        predText.style.color = "#ffffff";
        if (pourcentageMise > 0 && probabiliteGagne >= 0.65) {
            predText.innerText = "🔥 LE PARI EN VAUT LA PEINE !\nMisez idéalement : " + pourcentageMise.toFixed(1) + "% de votre capital.";
            confText.style.color = "#22c55e";
        } else if (pourcentageMise <= 0 && probabiliteGagne >= 0.60) {
            predText.innerText = "⚠️ ATTENTION : Cote trop basse pour la prise de risque.\nLe calcul de Kelly conseille de s'abstenir (0%).";
            confText.style.color = "#facc15";
        } else {
            predText.innerText = "❌ ALERTE DANGER : Ne pas jouer.\nRisque de perte trop élevé.";
            confText.style.color = "#ef4444";
        }
    }
    function effacer() {
        document.getElementById('defaites').value = ""; document.getElementById('buts').value = ""; document.getElementById('cote').value = "";
        document.getElementById('prediction').innerText = "En attente de saisie des données..."; document.getElementById('prediction').style.color = "#ffffff"; document.getElementById('confiance').innerText = "";
    }
</script>
</body>
</html>
