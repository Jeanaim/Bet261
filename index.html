<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet261 Virtual Expert Pro</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151f32;
            --accent: #22c55e;
            --gold: #facc15;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #22314d;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }
        .app-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .badge {
            background: rgba(250, 204, 21, 0.1);
            color: var(--gold);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        h1 { font-size: 24px; margin: 8px 0 0 0; font-weight: 800; color: #fff; }
        h1 span { color: var(--gold); }
        .subtitle { color: var(--text-sub); font-size: 12px; margin: 4px 0 0 0; }
        
        .form-group { display: flex; gap: 10px; margin-bottom: 16px; }
        .input-box { flex: 1; display: flex; flex-direction: column; }
        label { color: var(--text-sub); font-size: 11px; font-weight: bold; margin-bottom: 4px; text-transform: uppercase; }
        select, input {
            background: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            width: 100%;
        }
        select:focus, input:focus { border-color: var(--gold); }
        
        .btn-prime {
            width: 100%;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-sec {
            width: 100%;
            background: transparent;
            color: var(--text-sub);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 8px;
        }

        /* Résultats */
        .res-panel {
            background: #0b0f19;
            border-radius: 16px;
            padding: 16px;
            margin-top: 20px;
            border: 1px solid var(--border);
            display: none;
        }
        .res-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed var(--border);
        }
        .res-row:last-child { border-bottom: none; }
        .res-label { font-size: 13px; color: var(--text-sub); }
        .res-val { font-size: 14px; font-weight: bold; color: #fff; }
        .highlight { color: var(--gold); font-size: 16px; }
        .stars { color: var(--gold); font-size: 18px; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <span class="badge">Analyse Algorithmique Pure</span>
        <h1>BET261 <span>EXPERT V6</span></h1>
        <p class="subtitle">Calculateur de probabilités mathématiques inversées</p>
    </div>

    <div class="form-group">
        <div class="input-box">
            <label>Équipe Domicile</label>
            <select id="homeTeam"></select>
        </div>
        <div class="input-box">
            <label>Équipe Extérieur</label>
            <select id="awayTeam"></select>
        </div>
    </div>

    <div class="form-group">
        <div class="input-box">
            <label>Cote [1]</label>
            <input type="number" step="0.01" id="cote1" placeholder="Ex: 1.73">
        </div>
        <div class="input-box">
            <label>Cote [N]</label>
            <input type="number" step="0.01" id="coteN" placeholder="Ex: 3.63">
        </div>
        <div class="input-box">
            <label>Cote [2]</label>
            <input type="number" step="0.01" id="cote2" placeholder="Ex: 4.86">
        </div>
    </div>

    <button class="btn-prime" onclick="calculerCotesInversees()">ANALYSER LES COTES</button>
    <button class="btn-sec" onclick="reinitialiser()">Effacer</button>

    <div class="res-panel" id="resultats">
        <div class="res-row">
            <span class="res-label">Match :</span>
            <span class="res-val" id="match-title" style="color:var(--gold)">-</span>
        </div>
        <div class="res-row">
            <span class="res-label">📈 Force Estimée (Favori) :</span>
            <span class="res-val" id="val-proba-pure" style="color:#fff">0%</span>
        </div>
        <div class="res-row">
            <span class="res-label">⭐ Indice de Confiance :</span>
            <span class="stars" id="val-stars">⭐⭐⭐</span>
        </div>
        <div class="res-row">
            <span class="res-label">📋 Option Conseillée :</span>
            <span class="res-val" id="val-option" style="color:#22c55e">-</span>
        </div>
        <div class="res-row">
            <span class="res-label">⚽ Estimation Buts :</span>
            <span class="res-val highlight" id="val-total-buts">-</span>
        </div>
        <div class="res-row">
            <span class="res-label">🎯 Alignement Score Exact :</span>
            <span class="res-val highlight" id="val-score" style="color:var(--gold)">-</span>
        </div>
    </div>
</div>
