<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet261 Virtual Expert Pro</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151f32;
            --accent: #22c55e;
            --gold: #facc15;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #22314d;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }
        .app-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .badge {
            background: rgba(250, 204, 21, 0.1);
            color: var(--gold);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        h1 { font-size: 24px; margin: 8px 0 0 0; font-weight: 800; color: #fff; }
        h1 span { color: var(--gold); }
        .subtitle { color: var(--text-sub); font-size: 12px; margin: 4px 0 0 0; }
        
        .form-group { display: flex; gap: 10px; margin-bottom: 12px; }
        .input-box { flex: 1; display: flex; flex-direction: column; }
        label { color: var(--text-sub); font-size: 11px; font-weight: bold; margin-bottom: 4px; text-transform: uppercase; }
        select, input {
            background: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            width: 100%;
        }
        select:focus, input:focus { border-color: var(--gold); }
        
        .btn-prime {
            width: 100%;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-sec {
            width: 100%;
            background: transparent;
            color: var(--text-sub);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 8px;
        }

        /* Résultats */
        .res-panel {
            background: #0b0f19;
            border-radius: 16px;
            padding: 16px;
            margin-top: 20px;
            border: 1px solid var(--border);
            display: none;
        }
        .res-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border);
        }
        .res-row:last-child { border-bottom: none; }
        .res-label { font-size: 13px; color: var(--text-sub); }
        .res-val { font-size: 14px; font-weight: bold; color: #fff; }
        .highlight { color: var(--gold); font-size: 16px; }
        
        .gauge-container { width: 100%; background: #1e293b; height: 6px; border-radius: 10px; margin-top: 4px; overflow: hidden; }
        .gauge-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.4s; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <span class="badge">Bet261 Ligue Anglaise Virtuelle</span>
        <h1>BET261 <span>EXPERT V3</span></h1>
        <p class="subtitle">Analyseur de Scores et Buts (Algorithme Kelly)</p>
    </div>

    <div class="form-group">
        <div class="input-box">
            <label>Équipe Domicile</label>
            <select id="homeTeam"></select>
        </div>
        <div class="input-box">
            <label>Équipe Extérieur</label>
            <select id="awayTeam"></select>
        </div>
    </div>

    <div class="form-group">
        <div class="input-box">
            <label>Série Sans Victoire (Dom)</label>
            <input type="number" id="defaites" placeholder="Ex: 3" value="0">
        </div>
        <div class="input-box">
            <label>Moy. Buts (3 dern. matchs)</label>
            <input type="number" step="0.1" id="buts" placeholder="Ex: 2.1" value="1.5">
        </div>
    </div>

    <div class="form-group">
        <div class="input-box">
            <label>Cote 1</label>
            <input type="number" step="0.01" id="cote1" placeholder="1">
        </div>
        <div class="input-box">
            <label>Cote N</label>
            <input type="number" step="0.01" id="coteN" placeholder="N">
        </div>
        <div class="input-box">
            <label>Cote 2</label>
            <input type="number" step="0.01" id="cote2" placeholder="2">
        </div>
    </div>

    <button class="btn-prime" onclick="genererAnalyse()">CALCULER LES PRÉDICTIONS</button>
    <button class="btn-sec" onclick="reinitialiser()">Effacer</button>

    <div class="res-panel" id="resultats">
        <div class="res-row">
            <span class="res-label">Match Analysé :</span>
            <span class="res-val" id="match-title" style="color:var(--gold)">-</span>
        </div>
        <div class="res-row">
            <span class="res-label">Probabilité Victoire :</span>
            <div style="text-align: right; width: 50%;">
                <span class="res-val" id="val-percent">0%</span>
                <div class="gauge-container"><div class="gauge-bar" id="jauge"></div></div>
            </div>
        </div>
        <div class="res-row">
            <span class="res-label">Conseil de Mise (Kelly) :</span>
            <span class="res-val" id="val-advice">-</span>
        </div>
        <div class="res-row">
            <span class="res-label">💡 Prédiction Total Buts :</span>
            <span class="res-val highlight" id="val-total-buts">-</span>
        </div>
        <div class="res-row">
            <span class="res-label">🎯 Score Exact Probable :</span>
            <span class="res-val highlight" id="val-score" style="color:#22c55e">-</span>
        </div>
    </div>
</div>

<script>
    // Liste officielle des clubs de la capture d'écran
    const clubs = [
        "Bournemouth", "Manchester Blue", "C. Palace", "A. Villa", 
        "London Blues", "Everton", "Newcastle", "Fulham", 
        "Manchester Red", "N. Forest", "Brighton", "London Reds", 
        "Wolverhampton", "Spurs", "Liverpool", "Sunderland", 
        "Leeds", "Brentford", "Burnley", "West Ham"
    ].sort();

    // Remplir automatiquement les listes déroulantes
    const homeSelect = document.getElementById('homeTeam');
    const awaySelect = document.getElementById('awayTeam');
    clubs.forEach(club => {
        homeSelect.options[homeSelect.options.length] = new Option(club, club);
        awaySelect.options[awaySelect.options.length] = new Option(club, club);
    });
    // Sélection par défaut différente
    awaySelect.selectedIndex = 1;

    function genererAnalyse() {
        const home = document.getElementById('homeTeam').value;
        const away = document.getElementById('awayTeam').value;
        const defaites = parseInt(document.getElementById('defaites').value) || 0;
        const buts = parseFloat(document.getElementById('buts').value) || 0;
        
        const c1 = parseFloat(document.getElementById('cote1').value) || 0;
        const cN = parseFloat(document.getElementById('coteN').value) || 0;
        const c2 = parseFloat(document.getElementById('cote2').value) || 0;

        if (home === away) {
            alert("Veuillez choisir deux équipes différentes !");
            return;
        }
        if (!c1 || !cN || !c2) {
            alert("Veuillez remplir les 3 cotes (1, N, 2) du match !");
            return;
        }

        document.getElementById('resultats').style.display = "block";
        document.getElementById('match-title').innerText = home + " vs " + away;

        // 1. Calcul Probabilité & Kelly basé sur la cote la plus basse (favori)
        let coteFavori = Math.min(c1, c2);
        let proba = 0.38;
        if (defaites > 0) proba += (defaites * 0.10);
        if (buts > 2.2) proba += 0.06;
        if (proba > 0.92) proba = 0.92;

        const b = coteFavori - 1;
        const kelly = ((b * proba) - (1 - proba)) / b;
        const mise = kelly * 100;

        const probaArrondie = Math.round(proba * 100);
        document.getElementById('val-percent').innerText = probaArrondie + "%";
        document.getElementById('jauge').style.width = probaArrondie + "%";

        // Conseil de mise
        const txtAdvice = document.getElementById('val-advice');
        if (mise > 0 && proba >= 0.62) {
            txtAdvice.innerText = "Misez " + mise.toFixed(1) + "% sur le Favori";
            txtAdvice.style.color = "#22c55e";
        } else {
            txtAdvice.innerText = "🚫 Pas de mise sûre (0%)";
            txtAdvice.style.color = "#ef4444";
        }

        // 2. Prédiction Nombre de Buts (Over / Under)
        const txtTotal = document.getElementById('val-total-buts');
        if (buts >= 2.5) {
            txtTotal.innerText = "Plus de 2.5 Buts (Over)";
        } else if (buts <= 1.5) {
            txtTotal.innerText = "Moins de 1.5 Buts (Under)";
        } else {
            txtTotal.innerText = "2 ou 3 Buts dans le match";
        }

        // 3. Algorithme de Génération du Score Exact Virtuel
        const txtScore = document.getElementById('val-score');
        if (c1 < c2) { // Si Domicile favori
            if (buts >= 2.6) txtScore.innerText = "2-1 ou 3-1";
            else if (buts <= 1.6) txtScore.innerText = "1-0 ou 2-0";
            else txtScore.innerText = "2-0 ou 2-1";
        } else if (c2 < c1) { // Si Extérieur favori
            if (buts >= 2.6) txtScore.innerText = "1-2 ou 1-3";
            else if (buts <= 1.6) txtScore.innerText = "0-1 ou 0-2";
            else txtScore.innerText = "0-2 ou 1-2";
        } else { // Si Match serré / Nul
            if (buts >= 2.5) txtScore.innerText = "2-2 ou 1-1";
            else txtScore.innerText = "0-0 ou 1-1";
        }
    }

    function reinitialiser() {
        document.getElementById('defaites').value = "0";
        document.getElementById('buts').value = "1.5";
        document.getElementById('cote1').value = "";
        document.getElementById('coteN').value = "";
        document.getElementById('cote2').value = "";
        document.getElementById('resultats').style.display = "none";
    }
</script>

</body>
</html>
